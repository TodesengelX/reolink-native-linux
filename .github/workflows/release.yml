# Release automation: on a version tag (v*), build an AppImage and a Flatpak
# bundle and attach both to the GitHub Release.  Cut a release with:
#   git tag v0.1.0 && git push origin v0.1.0
name: release
on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  appimage:
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - name: Install Qt 6
        uses: jurplel/install-qt-action@v4
        with:
          version: '6.7.2'
          modules: 'qtmultimedia qtshadertools'
      - name: System deps
        run: |
          sudo apt-get update
          sudo apt-get install -y libavformat-dev libavcodec-dev libavutil-dev \
            libswscale-dev libcurl4-openssl-dev libsecret-1-dev libsqlite3-dev \
            libfuse2 wget
      - name: Build + install into AppDir
        run: |
          cmake -S . -B build -G "Unix Makefiles" -DCMAKE_BUILD_TYPE=Release -DCMAKE_INSTALL_PREFIX=/usr
          cmake --build build -j"$(nproc)"
          DESTDIR="$PWD/AppDir" cmake --install build
      - name: Package AppImage (linuxdeployqt)
        env:
          APPIMAGE_EXTRACT_AND_RUN: '1'
          VERSION: ${{ github.ref_name }}
        run: |
          wget -q https://github.com/probonopd/linuxdeployqt/releases/download/continuous/linuxdeployqt-continuous-x86_64.AppImage -O /tmp/linuxdeployqt
          chmod +x /tmp/linuxdeployqt
          /tmp/linuxdeployqt AppDir/usr/share/applications/io.github.todesengelx.ReolinkLinux.desktop \
            -qmldir=src/ui/qml -appimage -unsupported-allow-new-glibc
          mv ./*.AppImage reolink-native-linux-x86_64.AppImage
      - uses: actions/upload-artifact@v4
        with: { name: appimage, path: '*.AppImage' }

  flatpak:
    runs-on: ubuntu-latest
    continue-on-error: true
    container:
      image: bilelmoussaoui/flatpak-github-actions:kde-6.7
      options: --privileged
    steps:
      - uses: actions/checkout@v4
      - uses: flatpak/flatpak-github-actions/flatpak-builder@v6
        with:
          bundle: reolink-native-linux.flatpak
          manifest-path: packaging/flatpak/io.github.todesengelx.ReolinkLinux.yml
          cache-key: flatpak-builder-${{ github.sha }}
      - uses: actions/upload-artifact@v4
        with: { name: flatpak, path: reolink-native-linux.flatpak }

  release:
    needs: [appimage, flatpak]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with: { merge-multiple: true }
      - uses: softprops/action-gh-release@v2
        with:
          files: |
            *.AppImage
            *.flatpak
          fail_on_unmatched_files: false
          generate_release_notes: true
