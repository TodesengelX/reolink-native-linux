# Release automation: on a version tag (v*), build an AppImage and a Flatpak
# bundle and attach both to the GitHub Release.  Cut a release with:
#   git tag v0.1.0 && git push origin v0.1.0
name: release
on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  appimage:
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - name: Install Qt 6
        uses: jurplel/install-qt-action@v4
        with:
          version: '6.7.2'
          modules: 'qtmultimedia qtshadertools'
      - name: System deps
        run: |
          sudo apt-get update
          sudo apt-get install -y libavformat-dev libavcodec-dev libavutil-dev \
            libswscale-dev libcurl4-openssl-dev libsecret-1-dev libsqlite3-dev \
            libfuse2 wget
      - name: Build + install into AppDir
        run: |
          cmake -S . -B build -G "Unix Makefiles" -DCMAKE_BUILD_TYPE=Release -DCMAKE_INSTALL_PREFIX=/usr
          cmake --build build -j"$(nproc)"
          DESTDIR="$PWD/AppDir" cmake --install build
      - name: Package AppImage (linuxdeploy + qt plugin)
        env:
          APPIMAGE_EXTRACT_AND_RUN: '1'
          NO_STRIP: '1'
          QML_SOURCES_PATHS: ${{ github.workspace }}/src/ui/qml
          OUTPUT: reolink-native-linux-x86_64.AppImage
          # Bundle Qt's Wayland platform plugins too (the qt plugin ships only the
          # "best" platform = xcb by default), so the app runs natively on Wayland
          # instead of falling back to XWayland.
          EXTRA_PLATFORM_PLUGINS: 'libqwayland-egl.so;libqwayland-generic.so'
        run: |
          # The qt plugin locates Qt via $QMAKE — without it, it finds no
          # modules ("Could not find Qt modules to deploy").
          export QMAKE="$QT_ROOT_DIR/bin/qmake"
          # Qt6 ships the Wayland platform plugins in the base install; confirm
          # they're present so EXTRA_PLATFORM_PLUGINS has something to bundle.
          echo "Available platform plugins:"; ls "$QT_ROOT_DIR/plugins/platforms/"
          # The qt plugin bundles every SQL driver plugin; the Mimer and MySQL
          # ones pull in proprietary client libs (libmimerapi.so / libmysqlclient)
          # that aren't installed, which fails the whole run. We only use SQLite.
          find "$QT_ROOT_DIR/plugins/sqldrivers" -name 'libqsql*.so' \
            ! -name 'libqsqlite.so' -delete || true
          for t in linuxdeploy linuxdeploy-plugin-qt; do
            wget -q "https://github.com/linuxdeploy/$t/releases/download/continuous/$t-x86_64.AppImage" -O "/tmp/$t"
            chmod +x "/tmp/$t"
          done
          DESKTOP=AppDir/usr/share/applications/io.github.todesengelx.ReolinkLinux.desktop
          # Phase 1: deploy Qt into the AppDir (no packaging yet).
          /tmp/linuxdeploy --appdir AppDir --plugin qt -d "$DESKTOP"
          # linuxdeploy-plugin-qt deploys the wayland decoration + shell-integration
          # plugins but NOT graphics-integration-client (the EGL client-buffer
          # integration) — without it Qt Quick aborts on Wayland ("Failed to create
          # RHI"). Its runtime lib (libQt6WaylandEglClientHwIntegration) is already
          # in usr/lib as a dep of the wayland platform plugin, so copy the plugin
          # in by hand, then package.
          cp -av "$QT_ROOT_DIR/plugins/wayland-graphics-integration-client" AppDir/usr/plugins/
          # libva is a thin loader that dlopen()s a driver (radeonsi/iHD/...)
          # built against the host's Mesa. A bundled libva cannot load the host's
          # driver, so every decode silently fell back to software — that is the
          # v0.1.4 bug. The host's own libva pairs correctly with its own driver.
          #
          # MOVE rather than delete: the bundled libavutil/libavcodec carry a hard
          # DT_NEEDED on libva.so.2 / libva-drm.so.2 / libva-x11.so.2, so deleting
          # outright would stop the app from STARTING on a host with no libva —
          # worse than software decode. Out of the search path, the host's copy
          # wins when present, and AppRun below restores the bundled one when it
          # is genuinely absent.
          #
          # This is a plain mv on purpose: linuxdeploy accepts --exclude-library
          # and then SILENTLY IGNORES IT, which is why v0.1.4 shipped libva
          # despite carrying that flag.
          mkdir -p AppDir/usr/lib/va-fallback
          mv -v AppDir/usr/lib/libva*.so* AppDir/usr/lib/va-fallback/ || true
          if ls AppDir/usr/lib/libva*.so* >/dev/null 2>&1; then
            echo "::error::libva still on the AppDir search path"; exit 1
          fi
          # linuxdeploy's default AppRun is a bare symlink to the binary, so
          # there is no hook mechanism to extend — supply a real one. It keeps
          # APPIMAGE/APPDIR (the updater and autostart entry both read APPIMAGE)
          # because exec preserves the environment.
          rm -f AppDir/AppRun
          cat > AppDir/AppRun <<'APPRUN'
          #!/bin/sh
          HERE="$(dirname "$(readlink -f "$0")")"
          # Use the host's libva when it exists; fall back to the bundled copy
          # only to keep the app launchable, accepting software decode there.
          have_libva=0
          for probe in ldconfig /sbin/ldconfig /usr/sbin/ldconfig; do
              if "$probe" -p 2>/dev/null | grep -q 'libva\.so\.2'; then have_libva=1; break; fi
          done
          if [ "$have_libva" -eq 0 ]; then
              for d in /usr/lib/x86_64-linux-gnu /usr/lib64 /usr/lib /lib/x86_64-linux-gnu /lib64; do
                  if [ -e "$d/libva.so.2" ]; then have_libva=1; break; fi
              done
          fi
          if [ "$have_libva" -eq 0 ]; then
              export LD_LIBRARY_PATH="$HERE/usr/lib/va-fallback${LD_LIBRARY_PATH:+:$LD_LIBRARY_PATH}"
          fi
          exec "$HERE/usr/bin/reolink-client" "$@"
          APPRUN
          chmod +x AppDir/AppRun
          # Phase 2: package with appimagetool DIRECTLY rather than a second
          # linuxdeploy pass. Running linuxdeploy again re-scans the binaries and
          # re-deploys libva — it is a DT_NEEDED of the bundled libavutil — which
          # silently undid the move above. (The verification below caught exactly
          # that, so leave both in place.) Phase 1 already produced everything
          # appimagetool needs in the AppDir root: AppRun, .DirIcon, the .desktop
          # and the icon. --no-appstream because our metainfo is validated
          # separately and a validator warning must not fail the release.
          wget -q "https://github.com/AppImage/appimagetool/releases/download/continuous/appimagetool-x86_64.AppImage" -O /tmp/appimagetool
          chmod +x /tmp/appimagetool
          ARCH=x86_64 /tmp/appimagetool --no-appstream AppDir reolink-native-linux-x86_64.AppImage
          # Verify the *shipped artifact*, not the AppDir. The AppImage is a
          # compressed squashfs, so `strings` over it proves nothing — extract.
          rm -rf squashfs-root
          ./reolink-native-linux-x86_64.AppImage --appimage-extract >/dev/null
          if ls squashfs-root/usr/lib/libva*.so* >/dev/null 2>&1; then
            echo "::error::libva is still on the search path in the AppImage"; exit 1
          fi
          test -f squashfs-root/usr/lib/va-fallback/libva.so.2 \
            || { echo "::error::libva fallback missing — app would not start without host libva"; exit 1; }
          grep -q 'va-fallback' squashfs-root/AppRun \
            || { echo "::error::AppRun is not the custom one (no libva fallback logic)"; exit 1; }
          echo "verified: host libva preferred, bundled copy retained as fallback"
          rm -rf squashfs-root
      - uses: actions/upload-artifact@v4
        with: { name: appimage, path: '*.AppImage' }

  flatpak:
    runs-on: ubuntu-latest
    continue-on-error: true
    container:
      image: bilelmoussaoui/flatpak-github-actions:kde-6.7
      options: --privileged
    steps:
      - uses: actions/checkout@v4
      - uses: flatpak/flatpak-github-actions/flatpak-builder@v6
        with:
          bundle: reolink-native-linux.flatpak
          manifest-path: packaging/flatpak/io.github.todesengelx.ReolinkLinux.yml
          cache-key: flatpak-builder-${{ github.sha }}
      - uses: actions/upload-artifact@v4
        with: { name: flatpak, path: reolink-native-linux.flatpak }

  release:
    needs: [appimage, flatpak]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with: { merge-multiple: true }
      - uses: softprops/action-gh-release@v2
        with:
          files: |
            *.AppImage
            *.flatpak
          fail_on_unmatched_files: false
          generate_release_notes: true
