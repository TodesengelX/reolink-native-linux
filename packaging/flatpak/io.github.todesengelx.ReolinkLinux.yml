# Flatpak manifest. Build:
#   flatpak-builder --user --install --force-clean build-flatpak \
#     packaging/flatpak/io.github.todesengelx.ReolinkLinux.yml
# The KDE runtime provides Qt 6 (LGPL, dynamically linked). libsecret talks to
# the host keyring via the portal.
#
# FFmpeg: the runtime's own FFmpeg is a stripped build WITHOUT the native H.264 /
# HEVC decoders — it only has libopenh264, which depends on the separately
# downloaded Cisco binary and fails with "Unable to create decoder" when that is
# missing, so no stream ever opens (issue #5). The ffmpeg-full extension (same
# freedesktop base as KDE 6.7 → 23.08) is mounted over it and provides the full
# decoder set, including VAAPI hw decode. Installing from a repo pulls it in
# automatically; for the .flatpak bundle the README lists the extra command.
app-id: io.github.todesengelx.ReolinkLinux
runtime: org.kde.Platform
runtime-version: '6.7'
sdk: org.kde.Sdk
command: reolink-client
finish-args:
  - --share=network
  - --share=ipc
  - --socket=wayland
  - --socket=fallback-x11
  - --socket=pulseaudio
  - --device=dri                     # GPU for hardware decode
  - --talk-name=org.freedesktop.secrets  # keyring for credentials
  - --filesystem=xdg-videos          # snapshots / recordings
add-extensions:
  org.freedesktop.Platform.ffmpeg-full:
    directory: lib/ffmpeg
    version: '23.08'
    add-ld-path: .
    autodelete: false
cleanup-commands:
  - mkdir -p /app/lib/ffmpeg         # mount point for the ffmpeg-full extension
modules:
  # The KDE SDK doesn't ship libsecret dev; build it (crypto disabled so it
  # doesn't pull in libgcrypt — the Secret portal handles storage encryption).
  - name: libsecret
    buildsystem: meson
    config-opts:
      - -Dmanpage=false
      - -Dgtk_doc=false
      - -Dintrospection=false
      - -Dvapi=false
      - -Dcrypto=disabled
    sources:
      - type: archive
        url: https://download.gnome.org/sources/libsecret/0.21/libsecret-0.21.4.tar.xz
        sha256: 163d08d783be6d4ab9a979ceb5a4fecbc1d9660d3c34168c581301cd53912b20
    cleanup:
      - /bin
      - /include
      - /lib/pkgconfig
  - name: reolink-client
    buildsystem: cmake-ninja
    config-opts:
      - -DCMAKE_BUILD_TYPE=Release
    sources:
      - type: dir
        path: ../..
