# Flatpak manifest. Build:
#   flatpak-builder --user --install --force-clean build-flatpak \
#     packaging/flatpak/io.github.todesengelx.ReolinkLinux.yml
# The KDE runtime provides Qt 6 (LGPL, dynamically linked). libsecret talks to
# the host keyring via the portal.
#
# FFmpeg + VAAPI: KDE 6.10 is built on freedesktop 25.08, whose runtime pulls
# in the codecs-extra extension automatically — a full FFmpeg build with the
# native H.264/HEVC decoders. The 23.08-based KDE 6.7 runtime only had the
# libopenh264 wrapper, which fails with "Unable to create decoder" unless Cisco's
# binary is installed, so no stream ever opened (issue #5). The newer GL
# extension also brings an Intel media driver that knows current GPUs (Arrow
# Lake), so hardware decode works there instead of falling back to the CPU.
app-id: io.github.todesengelx.ReolinkLinux
runtime: org.kde.Platform
runtime-version: '6.10'
sdk: org.kde.Sdk
command: reolink-client
finish-args:
  - --share=network
  - --share=ipc
  - --socket=wayland
  - --socket=fallback-x11
  - --socket=pulseaudio
  - --device=dri                     # GPU for hardware decode
  - --talk-name=org.freedesktop.secrets  # keyring for credentials
  - --filesystem=xdg-videos          # snapshots / recordings
modules:
  # The KDE SDK doesn't ship libsecret dev; build it (crypto disabled so it
  # doesn't pull in libgcrypt — the Secret portal handles storage encryption).
  - name: libsecret
    buildsystem: meson
    config-opts:
      - -Dmanpage=false
      - -Dgtk_doc=false
      - -Dintrospection=false
      - -Dvapi=false
      - -Dcrypto=disabled
    sources:
      - type: archive
        url: https://download.gnome.org/sources/libsecret/0.21/libsecret-0.21.4.tar.xz
        sha256: 163d08d783be6d4ab9a979ceb5a4fecbc1d9660d3c34168c581301cd53912b20
    cleanup:
      - /bin
      - /include
      - /lib/pkgconfig
  - name: reolink-client
    buildsystem: cmake-ninja
    config-opts:
      - -DCMAKE_BUILD_TYPE=Release
    sources:
      - type: dir
        path: ../..
